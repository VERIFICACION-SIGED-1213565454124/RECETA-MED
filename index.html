<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receta Médica</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Panel Superior -->
  <div class="control-panel">
    <div>
      <label>Logo: </label>
      <input type="file" id="logoInput" accept="image/*">
    </div>
    <div>
      <label>Folio: </label>
      <input type="text" id="folioInput" value="24010400686466" oninput="actualizarCodigo()">
    </div>
    <button onclick="window.print()" class="btn-print">Imprimir / Guardar PDF</button>
  </div>

  <!-- Hoja Documento -->
  <div class="documento">
    
    <!-- Título pequeño en esquina superior derecha -->
    <div class="top-title-right">Receta Médica</div>

    <!-- Encabezado -->
    <div class="header-grid">
      <!-- Columna Izquierda: Logo, Títulos y Código de Barras -->
      <div class="header-left">
        <div class="logo-container">
          <img id="logoImg" src="https://upload.wikimedia.org/wikipedia/commons/f/f7/IMSS_Logo.svg" alt="Logo IMSS">
        </div>
        <hr class="header-divider">
        <div class="titulos-bloque">
          <p class="subtitulo">DIRECCIÓN DE PRESTACIONES MÉDICAS</p>
          <h1 class="titulo">RECETA INDIVIDUAL</h1>
        </div>
        <div class="barcode-container">
          <svg id="barcode"></svg>
        </div>
      </div>

      <!-- Columna Derecha: Cuadro del Paciente -->
      <div class="box-paciente">
        <div class="nss-amed-row">
          <div class="nss-group">
            <span class="lbl-bold">NSS:</span>
            <input type="text" value="0396786874-0" class="inp-clean bold">
          </div>
          <div class="amed-group">
            <span class="lbl-bold">A MED.:</span>
            <input type="text" value="1F19780R" class="inp-clean bold text-right">
          </div>
        </div>

        <div class="campo-linea center paciente-bloque">
          <span class="label-top-sm">NOMBRE DEL PACIENTE</span>
          <input type="text" value="PATRICIA MARÍA VEGA SOLIS" class="input-full center bold inp-clean paciente-nombre">
        </div>

        <div class="curp-row">
          <span class="lbl-bold">CURP:</span>
          <input type="text" value="VESP781013MSPGLT02" class="inp-clean bold input-full">
        </div>

        <div class="grid-2col">
          <div class="campo-inline">
            <label>DELEGACIÓN:</label>
            <input type="text" value="NUEVO LEON" class="inp-clean bold">
          </div>
          <div class="campo-inline">
            <label>CVE PTAL</label>
            <input type="text" value="010113252110" class="inp-clean bold">
          </div>
          <div class="campo-inline">
            <label>UNIDAD:</label>
            <input type="text" value="UMF No. 24" class="inp-clean bold">
          </div>
          <div class="campo-inline">
            <label>TURNO:</label>
            <input type="text" value="VESPERTINO" class="inp-clean bold">
          </div>
          <div class="campo-inline">
            <label>CONSULTORIO:</label>
            <input type="text" value="2" class="inp-clean bold">
          </div>
        </div>
      </div>
    </div>

    <!-- Sección Central: Folio, QR y Leyenda -->
    <div class="middle-section">
      <div class="middle-grid">
        <div class="folio-container">
          <p class="folio-text">Folio: &nbsp;&nbsp;&nbsp;&nbsp;<span>24010400686466</span></p>
          <p class="vigencia">ESTA RECETA NO SE SURTIRÁ DESPUÉS DE LAS 72 HORAS DE SU EXPEDICIÓN</p>
        </div>

        <div class="qr-container">
          <div id="qrcode"></div>
        </div>
      </div>
      <p class="farmacia-msg">Asegura tu medicamento presentando tu receta en Farmacia</p>
    </div>

    <!-- Cuerpo Principal de la Receta -->
    <div class="body-box">
      <div class="campo-inline fecha-row">
        <label>Fecha :</label>
        <input type="text" value="Lunes 13 de mayo de 2026" class="input-fecha inp-clean">
      </div>

      <div class="prescripcion-area">
        <textarea id="medsInput" oninput="formatearMedicamentos()" placeholder="Escriba aquí los medicamentos e indicaciones..."></textarea>
        <div id="medsFormatted" class="meds-display"></div>
      </div>

      <!-- Pie del Cuerpo -->
      <div class="footer-body">
        <div class="grid-medico">
          <div class="campo-inline">
            <label>Nombre y firma del médico</label>
            <input type="text" value="DR. JUAN PÉREZ LÓPEZ" class="inp-clean">
          </div>
          <div class="campo-inline">
            <label>Cédula Profesional</label>
            <input type="text" value="12345678" class="inp-clean">
          </div>
          <div class="campo-inline right">
            <label>Matrícula</label>
            <input type="text" value="991823" class="w-small inp-clean">
          </div>
        </div>
        <div class="paciente-tag">PACIENTE</div>
      </div>
    </div>

  </div>

  <script>
    function actualizarCodigo() {
      const folio = document.getElementById('folioInput').value || '000000000';
      document.querySelector('.folio-text span').innerText = folio;

      JsBarcode("#barcode", folio, {
        format: "CODE128",
        height: 45,
        width: 1.5,
        displayValue: false,
        margin: 0
      });

      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: folio,
        width: 65,
        height: 65
      });
    }

    document.getElementById('logoInput').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('logoImg').src = reader.result;
      };
      if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function formatearMedicamentos() {
      const text = document.getElementById('medsInput').value;
      const display = document.getElementById('medsFormatted');
      
      const regex = /\b([A-ZÁÉÍÓÚÑ0-9\/\.\-]+(?:\s+[A-ZÁÉÍÓÚÑ0-9\/\.\-]+)*)\b/g;

      let htmlText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      let result = htmlText.replace(regex, function(match) {
        if (/[A-ZÁÉÍÓÚÑ]/.test(match)) {
          return '<span class="subrayado-mayuscula">' + match + '</span>';
        }
        return match;
      });

      display.innerHTML = result.replace(/\n/g, '<br>');
    }

    document.getElementById('medsInput').value = 
`SUBSALICILATO DE BISMUTO SUSPENSIÓN CADA 100 ML CONTIENEN: SUBSALICILATO DE BISMUTO 1.75 G. ENVASE CON 120 ML. Vía de administración: Oral. 30 ML cada 6 hora(s) durante 5 día(s).`;

    actualizarCodigo();
    formatearMedicamentos();
  </script>
</body>
</html>
