<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Receta Médica</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería para generar el código de barras -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- Librería para generar el código QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Panel de control (No visible al imprimir) -->
  <div class="control-panel">
    <h2>Panel de Configuración</h2>
    
    <label>Logo de la Institución:</label>
    <input type="file" id="logoInput" accept="image/*">

    <label>Folio:</label>
    <input type="text" id="folioInput" value="123456789" oninput="actualizarCodigo()">

    <button onclick="window.print()" class="btn-print">Imprimir / Guardar PDF</button>
  </div>

  <!-- Hoja Imprimible -->
  <div class="documento">
    
    <!-- Encabezado Superior -->
    <div class="header-grid">
      <!-- Sección Logo y Título -->
      <div class="header-left">
        <div class="logo-container">
          <img id="logoImg" src="https://via.placeholder.com/300x80/cccccc/333333?text=LOGO+AUTOMATICO+AQUI" alt="Logo">
        </div>
        <p class="subtitulo">DIRECCIÓN DE PRESTACIONES MÉDICAS</p>
        <h1 class="titulo">RECETA INDIVIDUAL</h1>
      </div>

      <!-- Cuadro Datos del Paciente -->
      <div class="box-paciente">
        <div class="campo-linea center">
          <input type="text" value="APELLIDO PATERNO MATERNO NOMBRE(S)" class="input-full center bold">
          <span class="label-under">NOMBRE DEL PACIENTE</span>
        </div>
        <div class="campo-linea center">
          <input type="text" value="XXXX-XXXXXX-X" class="input-full center bold">
        </div>

        <div class="grid-2col">
          <div class="campo-inline">
            <label>DELEGACIÓN:</label>
            <input type="text" value="NORTE">
          </div>
          <div></div>
          <div class="campo-inline">
            <label>UNIDAD:</label>
            <input type="text" value="UMF 01">
          </div>
          <div class="campo-inline">
            <input type="text" value="33" class="w-small">
          </div>
          <div class="campo-inline">
            <label>CONSULTORIO:</label>
            <input type="text" value="02">
          </div>
          <div class="campo-inline">
            <label>TURNO:</label>
            <input type="text" value="MATUTINO">
          </div>
        </div>
      </div>
    </div>

    <!-- Sección de Código de Barras, Folio y QR -->
    <div class="middle-grid">
      <div class="barcode-container">
        <svg id="barcode"></svg>
      </div>

      <div class="folio-container">
        <p class="folio-text">Folio : <span id="folioDisplay">123456789</span></p>
        <p class="vigencia">ESTA RECETA NO SE SURTIRÁ DESPUÉS DE LAS 72 HORAS DE SU EXPEDICIÓN</p>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
      </div>
    </div>

    <!-- Cuerpo Principal de la Receta -->
    <div class="body-box">
      <div class="campo-inline fecha-row">
        <label>Fecha</label>
        <input type="text" value="11/08/2026" class="input-fecha">
      </div>

      <!-- Área de prescripción/indicaciones -->
      <div class="prescripcion-area">
        <textarea placeholder="Escriba aquí la prescripción médica, medicamentos e indicaciones..."></textarea>
      </div>

      <!-- Pie del Cuerpo -->
      <div class="footer-body">
        <div class="grid-medico">
          <div class="campo-inline">
            <label>Nombre y firma del médico</label>
            <input type="text" value="DR. JUAN PÉREZ LÓPEZ">
          </div>
          <div class="campo-inline">
            <label>Cédula Profesional</label>
            <input type="text" value="12345678">
          </div>
          <div class="campo-inline right">
            <label>Matricula</label>
            <input type="text" value="991823" class="w-small">
          </div>
        </div>
        <div class="paciente-tag">PACIENTE</div>
      </div>
    </div>

  </div>

  <script>
    // Generar Código de Barras y QR
    function actualizarCodigo() {
      const folio = document.getElementById('folioInput').value || '000000000';
      document.getElementById('folioDisplay').innerText = folio;

      // Código de Barras
      JsBarcode("#barcode", folio, {
        format: "CODE128",
        height: 40,
        displayValue: false
      });

      // Código QR
      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: folio,
        width: 90,
        height: 90
      });
    }

    // Cambiar Logo
    document.getElementById('logoInput').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('logoImg').src = reader.result;
      };
      if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    // Inicializar códigos al cargar
    actualizarCodigo();
  </script>
</body>
</html>
