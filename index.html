<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receta Médica</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Panel Superior -->
  <div class="control-panel">
    <div>
      <label>Logo: </label>
      <input type="file" id="logoInput" accept="image/*">
    </div>
    <div>
      <label>Folio: </label>
      <input type="text" id="folioInput" value="123456789" oninput="actualizarCodigo()">
    </div>
    <button onclick="window.print()" class="btn-print">Imprimir / Guardar PDF</button>
  </div>

  <!-- Hoja Documento -->
  <div class="documento">
    
    <!-- Título pequeño en esquina superior derecha -->
    <div class="top-title-right">Receta Médica</div>

    <!-- Encabezado -->
    <div class="header-grid">
      <!-- Columna Izquierda: Logo, Títulos y Código de Barras centrados entre sí -->
      <div class="header-left">
        <div class="logo-container">
          <img id="logoImg" src="https://via.placeholder.com/240x50/ffffff/000000?text=LOGO+INSTITUCIONAL" alt="Logo">
        </div>
        <div class="titulos-bloque">
          <p class="subtitulo">DIRECCIÓN DE PRESTACIONES MÉDICAS</p>
          <h1 class="titulo">RECETA INDIVIDUAL</h1>
        </div>
        <div class="barcode-container">
          <svg id="barcode"></svg>
        </div>
      </div>

      <!-- Columna Derecha: Cuadro del Paciente -->
      <div class="box-paciente">
        <div class="nss-row">
          <div><span class="lbl-top">NSS:</span> <input type="text" value="45465651" class="inp-clean bold"></div>
          <div class="amed-right"><span class="lbl-top">A.MED</span> <input type="text" value="16515615516" class="inp-clean bold text-right"></div>
        </div>

        <div class="campo-linea center">
          <span class="label-under">NOMBRE DEL PACIENTE</span>
          <input type="text" value="Jaime Leonardo Garcia Mendez" class="input-full center bold inp-clean">
        </div>

        <div class="grid-2col">
          <div class="campo-inline">
            <label>DELEGACIÓN:</label>
            <input type="text" value="Hermosillo" class="inp-clean">
          </div>
          <div></div>
          <div class="campo-inline">
            <label>UNIDAD:</label>
            <input type="text" value="UMF 05" class="inp-clean">
          </div>
          <div class="campo-inline">
            <label>Cva ptal:</label>
            <input type="text" value="5651561" class="inp-clean">
          </div>
          <div class="campo-inline">
            <label>CONSULTORIO:</label>
            <input type="text" value="02" class="inp-clean">
          </div>
          <div class="campo-inline">
            <label>TURNO:</label>
            <input type="text" value="MATUTINO" class="inp-clean">
          </div>
        </div>
      </div>
    </div>

    <!-- Sección Central: Folio y QR ajustado sin tocar bordes -->
    <div class="middle-grid">
      <div></div>
      <div class="folio-container">
        <p class="folio-text">Folio : <span id="folioDisplay">123456789</span></p>
        <p class="vigencia">ESTA RECETA NO SE SURTIRÁ DESPUÉS DE LAS 72 HORAS DE SU EXPEDICIÓN</p>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
      </div>
    </div>

    <!-- Cuerpo Principal de la Receta -->
    <div class="body-box">
      <div class="campo-inline fecha-row">
        <label>Fecha</label>
        <input type="text" value="13/02/2001" class="input-fecha inp-clean">
      </div>

      <div class="prescripcion-area">
        <textarea id="medsInput" oninput="formatearMedicamentos()" placeholder="Escriba aquí los medicamentos e indicaciones..."></textarea>
        <div id="medsFormatted" class="meds-display"></div>
      </div>

      <!-- Pie del Cuerpo -->
      <div class="footer-body">
        <div class="grid-medico">
          <div class="campo-inline">
            <label>Nombre y firma del médico</label>
            <input type="text" value="DR. JUAN PÉREZ LÓPEZ" class="inp-clean">
          </div>
          <div class="campo-inline">
            <label>Cédula Profesional</label>
            <input type="text" value="12345678" class="inp-clean">
          </div>
          <div class="campo-inline right">
            <label>Matrícula</label>
            <input type="text" value="991823" class="w-small inp-clean">
          </div>
        </div>
        <div class="paciente-tag">PACIENTE</div>
      </div>
    </div>

  </div>

  <script>
    function actualizarCodigo() {
      const folio = document.getElementById('folioInput').value || '000000000';
      document.getElementById('folioDisplay').innerText = folio;

      JsBarcode("#barcode", folio, {
        format: "CODE128",
        height: 35,
        width: 1.4,
        displayValue: false,
        margin: 0
      });

      // QR ajustado a 68px para evitar interrupción con los recuadros
      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: folio,
        width: 68,
        height: 68
      });
    }

    document.getElementById('logoInput').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('logoImg').src = reader.result;
      };
      if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function formatearMedicamentos() {
      const text = document.getElementById('medsInput').value;
      const display = document.getElementById('medsFormatted');
      
      const regex = /\b([A-ZÁÉÍÓÚÑ0-9\/\.\-]+(?:\s+[A-ZÁÉÍÓÚÑ0-9\/\.\-]+)*)\b/g;

      let htmlText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      let result = htmlText.replace(regex, function(match) {
        if (/[A-ZÁÉÍÓÚÑ]/.test(match)) {
          return '<span class="subrayado-mayuscula">' + match + '</span>';
        }
        return match;
      });

      display.innerHTML = result.replace(/\n/g, '<br>');
    }

    document.getElementById('medsInput').value = 
`APIXABÁN TABLETA. CADA TABLETA CONTIENE: APIXABÁN 5 MG. ENVASE CON 60 TABLETAS. Vía de administración: Oral. Una tableta cada 12 hora(s) durante 30 día(s). Cantidad a surtir: 1 ENV.

ENOXAPARINA SOLUCIÓN INYECTABLE. CADA JERINGA PRELLENADA CONTIENE: ENOXAPARINA SÓDICA 40 MG/0.4 ML. ENVASE CON 10 JERINGAS PRELLENADAS. Vía de administración: Subcutánea. Una jeringa cada 24 hora(s) durante 10 día(s). Cantidad a surtir: 1 ENV.`;

    actualizarCodigo();
    formatearMedicamentos();
  </script>
</body>
</html>
